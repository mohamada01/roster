name: Fetch company data

on:
  # The website triggers this the moment someone adds a link
  workflow_dispatch:
    inputs:
      mode:
        description: "queued = new links, scheduled = new + due for refresh, all = everything"
        required: false
        default: queued
      company_id:
        description: "Only this company id (optional)"
        required: false
        default: ""
  # Daily run: picks up anything queued and refreshes companies that are due
  schedule:
    - cron: "17 2 * * *" # 04:17 Cairo time

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Fetch
        run: node run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode || 'queued' }}
          COMPANY_ID: ${{ inputs.company_id }}
